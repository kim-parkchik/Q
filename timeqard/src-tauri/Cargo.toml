[package]
name = "timeqard"
version = "0.1.0"
description = "TimeQard（タイムカード）：Q の仲間の、打刻だけをするソフト"
authors = ["kim-parkchik"]
edition = "2021"

[lib]
name = "timeqard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Q（../../src-tauri）と同じ部品・同じ版を使う（Cargo.lock も Q のものから始めた。新しくダウンロードしないため）
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 管理のパスワード（Argon2。Q のログインと同じ）
argon2 = "0.5"
password-hash = "0.5"
rand_core = { version = "0.6", features = ["std"] }
# ブラウザ版（各自のパソコンから押す。DESIGN.md の 10）：同じネットワークの中だけの https のサーバーと、会社専用の証明書。
# 2026-11-12 にユーザーの許しを得て足した（rcgen・pem・yasna・httpdate は crates.io から新しく、rustls などは Mac にあったもの）
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time", "io-util"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
# 証明書の指紋（SHA-256・SHA-1）。rustls が使う ring をそのまま使う
ring = "0.17"

# Linux：画面の部品（WebKitGTK）でカメラを使えるようにする（初めは切ってある）。Tauri（wry）が使っているものと同じ版
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

# Argon2 は最適化しないと何倍も遅いので、開発中（tauri dev）でも最適化する
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# 配るもの：古いパソコンでも軽いように、小さく作る
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
