[package]
name = "timeqard"
version = "0.1.0"
description = "TimeQard（タイムカード）：Q の仲間の、打刻だけをするソフト"
authors = ["kim-parkchik"]
edition = "2021"

[lib]
name = "timeqard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Q（../../src-tauri）と同じ部品・同じ版を使う（Cargo.lock も Q のものから始めた。新しくダウンロードしないため）
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 管理のパスワード（Argon2。Q のログインと同じ）
argon2 = "0.5"
password-hash = "0.5"
rand_core = { version = "0.6", features = ["std"] }

# Linux：画面の部品（WebKitGTK）でカメラを使えるようにする（初めは切ってある）。Tauri（wry）が使っているものと同じ版
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

# Argon2 は最適化しないと何倍も遅いので、開発中（tauri dev）でも最適化する
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# 配るもの：古いパソコンでも軽いように、小さく作る
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
